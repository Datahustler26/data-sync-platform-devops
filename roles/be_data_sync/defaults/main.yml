---
# defaults file for be_data_sync

be_role: "service"

# Service installation directory structure
data_sync_dest: "/srv/data-sync"
data_sync_venv: "/srv/data-sync/venv"
data_sync_repo_url: "https://github.com/brightedge/data-sync.git"
data_sync_repo_version: "main"

# System service user & group
data_sync_user: "data-sync"
data_sync_group: "data-sync"

# Config variables read by systemd template
data_sync_app_env: "staging"
data_sync_redis_host: "redis-master.internal"
data_sync_redis_port: 6379
data_sync_log_level: "INFO"
data_sync_workers: 4
