# Production environment values for data-sync Helm chart.

replicaCount: 3

image:
  repository: brightedge/data-sync
  pullPolicy: IfNotPresent
  tag: "1.0.0"

resources:
  requests:
    cpu: 500m
    memory: 512Mi
  limits:
    cpu: 1000m
    memory: 1Gi

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 20
  targetCPUUtilizationPercentage: 70

podDisruptionBudget:
  enabled: true
  minAvailable: 1

serviceMonitor:
  enabled: true
  interval: 30s
  path: /metrics
  release: kube-prometheus-stack

env:
  appEnv: production
  redisHost: redis-prod.data-sync.svc.cluster.local
  redisPort: 6379
  logLevel: INFO
  workers: 4
  maxConnections: 200

secret:
  redisPassword: "prod-highly-secure-redis-password"
