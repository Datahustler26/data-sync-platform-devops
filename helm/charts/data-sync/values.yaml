# Default values for data-sync Helm chart.
# Safe defaults: small replicas, debug log level, local redis host.

replicaCount: 1

image:
  repository: brightedge/data-sync
  pullPolicy: IfNotPresent
  tag: "1.0.0"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true

service:
  type: ClusterIP
  port: 8080
  targetPort: 8080

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 250m
    memory: 256Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70

podDisruptionBudget:
  enabled: true
  minAvailable: 1

livenessProbe:
  httpGet:
    path: /health
    port: 8080
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /health
    port: 8080
  initialDelaySeconds: 5
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 2

serviceMonitor:
  enabled: true
  interval: 30s
  path: /metrics
  release: kube-prometheus-stack
  labels: {}

# Application environment configuration
env:
  appEnv: development
  redisHost: redis-master.data-sync.svc.cluster.local
  redisPort: 6379
  logLevel: DEBUG
  workers: 4
  maxConnections: 100

# Secret configuration (REDIS_PASSWORD)
secret:
  redisPassword: "dev-redis-password-change-me"
